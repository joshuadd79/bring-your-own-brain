<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYOB chat example</title>
<style>
  :root { --bg:#0f1220; --card:#171b30; --line:#2a3050; --text:#e8eaf6; --muted:#97a0c8; --me:#3b4cca; --bot:#222845; --accent:#10b981; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5fb; --card:#ffffff; --line:#d9dcee; --text:#1b1e33; --muted:#5b6285; --me:#4f5fe0; --bot:#eceefa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:18px; margin:0; }
  #conn { min-width:220px; height:44px; }            /* the BYOB connect button (an iframe) lives here */
  #status { color:var(--muted); font-size:13px; margin:8px 0; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:85%; padding:8px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .bot.typing:empty::after { content:"…"; opacity:.6; animation:blink 1s infinite; }   /* shows while the model is warming up */
  @keyframes blink { 50% { opacity:.15; } }
  form { display:flex; gap:8px; margin-top:10px; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#04130d; font-weight:700; font:inherit; font-weight:700; cursor:pointer; }
  button#stop { background:#f87171; color:#2a0505; }
  button[hidden] { display:none; }
  input:disabled, button:disabled { opacity:.45; cursor:not-allowed; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧠 BYOB chat example</h1>
    <div id="conn"></div>
  </header>
  <div id="status">Loading…</div>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="msg" placeholder="Connect your local AI first…" autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
</main>

<!-- STEP 1: the one line. Loads the SDK from bringyourownbrain.org (works from any domain). -->
<script src="https://bringyourownbrain.org/byob-web-sdk.js"></script>

<script>
const $ = (id) => document.getElementById(id);

// The conversation the model sees. Keep the system prompt short: this is a tiny local model.
const history = [{ role: 'system', content: 'You are a friendly assistant. Answer in one or two short sentences.' }];

/* ---------- STEP 2: create the brain and mount the connect button ---------- */
let heardFromHub = false;
if (!window.BringYourOwnBrainWeb) {
  $('status').textContent = '⚠️ Could not load the BYOB SDK. Check your connection and reload.';
} else {
  const brain = new BringYourOwnBrainWeb({
    container: $('conn'),            // put the button here (omit to float bottom-right)
    width: '220px', height: '44px',
    onState: (state, message) => {   // 'idle' | 'ready' | 'error' ...
      heardFromHub = true;
      const ready = state === 'ready';
      $('status').textContent = ready ? '✅ Local AI connected. Everything runs on your device.'
                              : state === 'error' ? '⚠️ ' + message
                              : 'Press the green button to connect your local AI.';
      $('msg').disabled = $('send').disabled = !ready;
      $('msg').placeholder = ready ? 'Say something…' : 'Connect your local AI first…';
      if (ready) $('msg').focus();
    }
  });
  brain.mount();                     // adds the iframe

  // Friendly hint if the hub never answers (offline, blocked, wrong URL)
  setTimeout(() => { if (!heardFromHub) $('status').textContent = '⚠️ Can’t reach bringyourownbrain.org. Check your connection and reload.'; }, 6000);

  /* ---------- STEP 3: chat ---------- */
  let current = null;                                    // the in-flight request; it has a .cancel() method
  $('stop').addEventListener('click', () => { if (current) current.cancel(); });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = $('msg').value.trim();
    if (!text || $('send').disabled) return;
    $('msg').value = '';
    setBusy(true);

    addBubble('user', text);
    history.push({ role: 'user', content: text });

    const bubble = addBubble('bot', '');
    bubble.classList.add('typing');
    const typer = makeTypewriter(bubble);
    brain.onChunk = (chunk) => typer.push(chunk);       // streamed text arrives here as it is generated

    // priority 'high' = a person is waiting. (Use 'low' for background work: it is preempted by anything more important.)
    current = brain.chat(history.slice(-11), { priority: 'high', max_tokens: 200, temperature: 0.7 });
    try {
      const reply = await current;
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      if (err.cancelled) {                                 // the Stop button (or a higher priority request) cancelled it
        if (err.partial) history.push({ role: 'assistant', content: err.partial });
        typer.push(' [stopped]');
      } else {
        typer.push('[error: ' + err.message + ']');
      }
    }
    current = null;
    brain.onChunk = null;
    await typer.finish();                                // let the typing animation catch up
    bubble.classList.remove('typing');
    setBusy(false);
  });
}

/* ---------- helpers ---------- */
function addBubble(who, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.textContent = text;                                  // textContent, never innerHTML: model output is untrusted
  $('log').appendChild(b);
  $('log').scrollTop = $('log').scrollHeight;
  return b;
}

function setBusy(busy) {
  $('msg').disabled = $('send').disabled = busy;
  $('stop').hidden = !busy;
  if (!busy) $('msg').focus();
}

// Typewriter: chunks go into a queue and are drained a few characters per tick.
// It speeds up automatically when the model is ahead, so it never lags behind or looks frozen.
function makeTypewriter(el) {
  let queue = '', done = false, resolve;
  const finished = new Promise((r) => (resolve = r));
  const timer = setInterval(() => {
    if (queue) {
      const n = Math.max(1, Math.ceil(queue.length / 10));
      el.textContent += queue.slice(0, n);
      queue = queue.slice(n);
      $('log').scrollTop = $('log').scrollHeight;
    } else if (done) {
      clearInterval(timer);
      resolve();
    }
  }, 20);
  return { push: (t) => { queue += t; }, finish: () => { done = true; return finished; } };
}
</script>
</body>
</html>
